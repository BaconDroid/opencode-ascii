name: Release and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # dist/ is committed and is the entry point OpenCode actually loads, so a
      # dist that has drifted from src silently serves stale code at runtime.
      - name: Verify dist is in sync with src
        run: git diff --exit-code -- dist

      - name: Test
        run: npm test

      # Fails early on a manifest that cannot be packed (bad files globs,
      # missing entry points) instead of after the tag already exists.
      - name: Verify the publishable tarball
        run: npm publish --dry-run

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
      contents: write # required to create the tag and the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gate on the registry, not on "did package.json change since the last
      # commit". The version can already sit in the tree without ever having
      # reached npm -- which is exactly the case for 0.2.0 -- and a
      # git-diff gate silently skips those releases.
      - name: Check whether this version is already published
        id: gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "opencode-ascii@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on npm -- nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is not on npm -- publishing."
          fi

      # Publish BEFORE tagging. If OIDC trusted publishing is not configured on
      # the registry side, this step fails while the tree is still clean, so a
      # retry is a no-op. Tagging first would strand a v<version> tag and a
      # GitHub release for a version that never shipped, and npm forbids
      # republishing that version number afterwards.
      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ""

      - name: Create tag
        if: steps.gate.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.gate.outputs.version }}"
          git push origin "v${{ steps.gate.outputs.version }}"

      - name: Create GitHub release
        if: steps.gate.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.gate.outputs.version }}';
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              generate_release_notes: true,
            });
